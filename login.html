<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Zonguru Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(135deg,#16002f,#3b176d,#16002f);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* TOP BUTTONS */

.top-tools{
  position:fixed;
  top:15px;
  right:15px;
  z-index:99999;
  display:flex;
  gap:8px;
}

.tool-btn{
  border:0;
  background:white;
  color:#5b21b6;
  border-radius:12px;
  padding:10px 14px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.tool-btn:active{
  transform:scale(.96);
}

.globe-btn{
  width:45px;
  padding:10px 0;
  font-size:18px;
}

/* LANGUAGE */

.language-menu{
  position:absolute;
  right:0;
  top:52px;
  width:180px;
  background:white;
  border-radius:14px;
  padding:8px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
  display:none;
}

.language-menu.open{
  display:block;
}

.language-item{
  width:100%;
  border:0;
  background:white;
  color:#333;
  padding:12px;
  text-align:left;
  border-radius:9px;
  cursor:pointer;
  font-size:14px;
}

.language-item:hover{
  background:#f3e8ff;
}

/* LOGIN */

.login-box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:24px;
  padding:35px 28px;
  box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.logo{
  width:65px;
  height:65px;
  margin:0 auto 14px;
  border-radius:18px;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:bold;
}

h1{
  text-align:center;
  color:#211333;
  font-size:28px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:28px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#333;
  font-size:14px;
  font-weight:bold;
}

input{
  width:100%;
  height:50px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:0 15px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#7c3aed;
  box-shadow:0 0 0 3px rgba(124,58,237,.1);
}

.forgot{
  text-align:right;
  margin-bottom:20px;
}

.forgot a{
  color:#6d28d9;
  font-size:13px;
  font-weight:bold;
  text-decoration:none;
}

.login-btn{
  width:100%;
  height:52px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.6;
}

.message{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:18px;
  font-size:14px;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.register{
  text-align:center;
  margin-top:22px;
  color:#777;
  font-size:14px;
}

.register a{
  color:#6d28d9;
  font-weight:bold;
  text-decoration:none;
}

.security{
  text-align:center;
  margin-top:20px;
  color:#999;
  font-size:12px;
}

/* CHAT */

.chat-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.chat-overlay.open{
  display:flex;
}

.chat-box{
  width:100%;
  max-width:420px;
  height:560px;
  background:white;
  border-radius:20px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.chat-header{
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  color:white;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.chat-close{
  border:0;
  background:transparent;
  color:white;
  font-size:25px;
  cursor:pointer;
}

.chat-body{
  flex:1;
  padding:15px;
  overflow-y:auto;
  background:#f8f7fb;
}

.chat-welcome{
  background:white;
  padding:12px;
  border-radius:12px;
  font-size:14px;
}

.chat-bottom{
  padding:12px;
  border-top:1px solid #eee;
  display:flex;
  gap:8px;
}

.chat-input{
  flex:1;
  height:44px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:0 12px;
}

.chat-send{
  width:48px;
  border:0;
  border-radius:10px;
  background:#7c3aed;
  color:white;
  cursor:pointer;
}

@media(max-width:600px){

  body{
    padding:14px;
  }

  .top-tools{
    top:10px;
    right:10px;
  }

  .tool-btn{
    padding:9px 10px;
    font-size:12px;
  }

  .login-box{
    padding:28px 20px;
  }

}

</style>

</head>

<body>


<!-- TOP TOOLS -->

<div class="top-tools">

  <button
    type="button"
    class="tool-btn"
    id="csButton">
    💬 Customer Service
  </button>

  <button
    type="button"
    class="tool-btn globe-btn"
    id="languageButton">
    🌐
  </button>

  <div
    class="language-menu"
    id="languageMenu">

    <button
      type="button"
      class="language-item"
      data-lang="en">
      🇬🇧 English
    </button>

    <button
      type="button"
      class="language-item"
      data-lang="es">
      🇪🇸 Español
    </button>

    <button
      type="button"
      class="language-item"
      data-lang="ar">
      🇸🇦 العربية
    </button>

    <button
      type="button"
      class="language-item"
      data-lang="pt">
      🇵🇹 Português
    </button>

    <button
      type="button"
      class="language-item"
      data-lang="my">
      🇲🇲 မြန်မာ
    </button>

  </div>

</div>


<!-- LOGIN -->

<div class="login-box">

  <div class="logo">
    Z
  </div>

  <h1 id="title">
    Welcome back
  </h1>

  <p
    class="subtitle"
    id="subtitle">
    Login to your Zonguru account
  </p>

  <div
    id="message"
    class="message">
  </div>

  <form id="loginForm">

    <div class="form-group">

      <label id="usernameLabel">
        Username
      </label>

      <input
        id="username"
        type="text"
        placeholder="Enter your username"
        required>

    </div>

    <div class="form-group">

      <label id="passwordLabel">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required>

    </div>

    <div class="forgot">

      <a
        href="#"
        id="forgot">
        Forgot password?
      </a>

    </div>

    <button
      id="loginButton"
      class="login-btn"
      type="submit">
      Login
    </button>

  </form>

  <div
    class="register"
    id="registerText">

    Don't have an account?
    <a href="register.html">
      Create Account
    </a>

  </div>

  <div
    class="security"
    id="securityText">

    🔒 Your account information is securely protected.

  </div>

</div>


<!-- CUSTOMER SERVICE CHAT -->

<div
  class="chat-overlay"
  id="chatOverlay">

  <div class="chat-box">

    <div class="chat-header">

      <strong id="chatTitle">
        Customer Service
      </strong>

      <button
        type="button"
        class="chat-close"
        id="chatClose">
        ×
      </button>

    </div>

    <div
      class="chat-body"
      id="chatBody">

      <div
        class="chat-welcome"
        id="chatWelcome">
        Hello! How can we help you?
      </div>

    </div>

    <div class="chat-bottom">

      <input
        id="chatInput"
        class="chat-input"
        placeholder="Type your message...">

      <button
        type="button"
        id="chatSend"
        class="chat-send">
        ➤
      </button>

    </div>

  </div>

</div>


<script>

const API_URL =
  "https://zonguru-jack-api.onrender.com";


/* =========================
   TRANSLATIONS
========================= */

const translations = {

  en:{
    title:"Welcome back",
    subtitle:"Login to your Zonguru account",
    username:"Username",
    usernamePlaceholder:"Enter your username",
    password:"Password",
    passwordPlaceholder:"Enter your password",
    forgot:"Forgot password?",
    login:"Login",
    register:"Don't have an account?",
    create:"Create Account",
    security:"🔒 Your account information is securely protected.",
    cs:"💬 Customer Service",
    chatTitle:"Customer Service",
    welcome:"Hello! How can we help you?",
    chatPlaceholder:"Type your message..."
  },

  es:{
    title:"Bienvenido de nuevo",
    subtitle:"Inicia sesión en tu cuenta de Zonguru",
    username:"Nombre de usuario",
    usernamePlaceholder:"Introduce tu nombre de usuario",
    password:"Contraseña",
    passwordPlaceholder:"Introduce tu contraseña",
    forgot:"¿Olvidaste tu contraseña?",
    login:"Iniciar sesión",
    register:"¿No tienes una cuenta?",
    create:"Crear cuenta",
    security:"🔒 Tu información está protegida de forma segura.",
    cs:"💬 Atención al cliente",
    chatTitle:"Atención al cliente",
    welcome:"¡Hola! ¿Cómo podemos ayudarte?",
    chatPlaceholder:"Escribe tu mensaje..."
  },

  pt:{
    title:"Bem-vindo de volta",
    subtitle:"Entre na sua conta Zonguru",
    username:"Nome de usuário",
    usernamePlaceholder:"Digite seu nome de usuário",
    password:"Senha",
    passwordPlaceholder:"Digite sua senha",
    forgot:"Esqueceu sua senha?",
    login:"Entrar",
    register:"Não tem uma conta?",
    create:"Criar conta",
    security:"🔒 Suas informações estão protegidas com segurança.",
    cs:"💬 Atendimento ao cliente",
    chatTitle:"Atendimento ao cliente",
    welcome:"Olá! Como podemos ajudar?",
    chatPlaceholder:"Digite sua mensagem..."
  },

  my:{
    title:"ပြန်လည်ကြိုဆိုပါတယ်",
    subtitle:"သင့် Zonguru အကောင့်သို့ ဝင်ရောက်ပါ",
    username:"အသုံးပြုသူအမည်",
    usernamePlaceholder:"အသုံးပြုသူအမည် ထည့်ပါ",
    password:"စကားဝှက်",
    passwordPlaceholder:"စကားဝှက် ထည့်ပါ",
    forgot:"စကားဝှက် မေ့နေပါသလား?",
    login:"ဝင်ရောက်မည်",
    register:"အကောင့်မရှိသေးပါသလား?",
    create:"အကောင့်ဖွင့်ရန်",
    security:"🔒 သင့်အကောင့်အချက်အလက်များကို လုံခြုံစွာ ကာကွယ်ထားပါသည်။",
    cs:"💬 Customer Service",
    chatTitle:"Customer Service",
    welcome:"မင်္ဂလာပါ။ ဘာကူညီပေးရမလဲ?",
    chatPlaceholder:"စာရေးပါ..."
  },

  ar:{
    title:"مرحباً بعودتك",
    subtitle:"قم بتسجيل الدخول إلى حساب Zonguru",
    username:"اسم المستخدم",
    usernamePlaceholder:"أدخل اسم المستخدم",
    password:"كلمة المرور",
    passwordPlaceholder:"أدخل كلمة المرور",
    forgot:"هل نسيت كلمة المرور؟",
    login:"تسجيل الدخول",
    register:"ليس لديك حساب؟",
    create:"إنشاء حساب",
    security:"🔒 معلومات حسابك محمية بشكل آمن.",
    cs:"💬 خدمة العملاء",
    chatTitle:"خدمة العملاء",
    welcome:"مرحباً! كيف يمكننا مساعدتك؟",
    chatPlaceholder:"اكتب رسالتك..."
  }

};


/* =========================
   ELEMENTS
========================= */

const languageButton =
  document.getElementById(
    "languageButton"
  );

const languageMenu =
  document.getElementById(
    "languageMenu"
  );

const csButton =
  document.getElementById(
    "csButton"
  );

const chatOverlay =
  document.getElementById(
    "chatOverlay"
  );

const chatClose =
  document.getElementById(
    "chatClose"
  );

const chatInput =
  document.getElementById(
    "chatInput"
  );

const chatSend =
  document.getElementById(
    "chatSend"
  );

const chatBody =
  document.getElementById(
    "chatBody"
  );


/* =========================
   LANGUAGE BUTTON
========================= */

languageButton.onclick =
  function(event){

    event.stopPropagation();

    languageMenu.classList.toggle(
      "open"
    );

  };


/* =========================
   LANGUAGE OPTIONS
========================= */

const languageItems =
  document.querySelectorAll(
    ".language-item"
  );


languageItems.forEach(
  function(item){

    item.onclick =
      function(event){

        event.stopPropagation();

        const lang =
          item.getAttribute(
            "data-lang"
          );

        changeLanguage(
          lang
        );

        languageMenu.classList.remove(
          "open"
        );

      };

  }
);


/* =========================
   OUTSIDE CLICK
========================= */

document.onclick =
  function(event){

    if(
      !languageMenu.contains(
        event.target
      ) &&
      event.target !==
        languageButton
    ){

      languageMenu.classList.remove(
        "open"
      );

    }

  };


/* =========================
   CHANGE LANGUAGE
========================= */

function changeLanguage(lang){

  const t =
    translations[lang] ||
    translations.en;

  document.getElementById(
    "title"
  ).textContent =
    t.title;

  document.getElementById(
    "subtitle"
  ).textContent =
    t.subtitle;

  document.getElementById(
    "usernameLabel"
  ).textContent =
    t.username;

  document.getElementById(
    "passwordLabel"
  ).textContent =
    t.password;

  document.getElementById(
    "username"
  ).placeholder =
    t.usernamePlaceholder;

  document.getElementById(
    "password"
  ).placeholder =
    t.passwordPlaceholder;

  document.getElementById(
    "forgot"
  ).textContent =
    t.forgot;

  document.getElementById(
    "loginButton"
  ).textContent =
    t.login;

  document.getElementById(
    "csButton"
  ).textContent =
    t.cs;

  document.getElementById(
    "chatTitle"
  ).textContent =
    t.chatTitle;

  document.getElementById(
    "chatWelcome"
  ).textContent =
    t.welcome;

  document.getElementById(
    "chatInput"
  ).placeholder =
    t.chatPlaceholder;

  document.getElementById(
    "securityText"
  ).textContent =
    t.security;

  document.getElementById(
    "registerText"
  ).innerHTML =
    t.register +
    ' <a href="register.html">' +
    t.create +
    "</a>";

  document.documentElement.lang =
    lang;

  document.body.dir =
    lang === "ar"
      ? "rtl"
      : "ltr";

  localStorage.setItem(
    "zonguru_lang",
    lang
  );

}


/* =========================
   LOAD LANGUAGE
========================= */

const savedLanguage =
  localStorage.getItem(
    "zonguru_lang"
  ) || "en";

changeLanguage(
  savedLanguage
);


/* =========================
   CUSTOMER SERVICE
========================= */

csButton.onclick =
  function(){

    chatOverlay.classList.add(
      "open"
    );

    chatInput.focus();

  };


chatClose.onclick =
  function(){

    chatOverlay.classList.remove(
      "open"
    );

  };


chatOverlay.onclick =
  function(event){

    if(
      event.target ===
      chatOverlay
    ){

      chatOverlay.classList.remove(
        "open"
      );

    }

  };


/* =========================
   CHAT SEND
========================= */

function sendChat(){

  const text =
    chatInput.value.trim();

  if(!text){
    return;
  }

  const bubble =
    document.createElement(
      "div"
    );

  bubble.style.background =
    "#7c3aed";

  bubble.style.color =
    "white";

  bubble.style.padding =
    "10px 13px";

  bubble.style.borderRadius =
    "14px";

  bubble.style.marginBottom =
    "10px";

  bubble.style.marginLeft =
    "auto";

  bubble.style.maxWidth =
    "80%";

  bubble.textContent =
    text;

  chatBody.appendChild(
    bubble
  );

  chatInput.value =
    "";

  chatBody.scrollTop =
    chatBody.scrollHeight;

}


chatSend.onclick =
  function(){

    sendChat();

  };


chatInput.onkeydown =
  function(event){

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      sendChat();

    }

  };


/* =========================
   LOGIN
========================= */

document.getElementById(
  "loginForm"
).onsubmit =
  async function(event){

    event.preventDefault();

    const username =
      document.getElementById(
        "username"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;

    const button =
      document.getElementById(
        "loginButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    if(
      !username ||
      !password
    ){

      message.textContent =
        "Please enter your username and password.";

      message.className =
        "message error";

      return;

    }


    button.disabled =
      true;

    button.textContent =
      "Logging in...";


    try{

      const response =
        await fetch(
          API_URL +
          "/api/auth/login",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              username:username,
              password:password
            })
          }
        );


      const data =
        await response.json();


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.message ||
          "Login failed."
        );

      }


      if(data.token){

        localStorage.setItem(
          "zonguru_token",
          data.token
        );

      }


      if(data.user){

        localStorage.setItem(
          "zonguru_user",
          JSON.stringify(
            data.user
          )
        );

      }


      message.textContent =
        "Login successful. Redirecting...";

      message.className =
        "message success";


      setTimeout(
        function(){

          window.location.href =
            "dashboard.html";

        },
        700
      );


    }catch(error){

      message.textContent =
        error.message ||
        "Unable to login.";

      message.className =
        "message error";

      button.disabled =
        false;

      button.textContent =
        translations[
          localStorage.getItem(
            "zonguru_lang"
          ) || "en"
        ].login;

    }

  };


/* =========================
   FORGOT PASSWORD
========================= */

document.getElementById(
  "forgot"
).onclick =
  function(event){

    event.preventDefault();

    chatOverlay.classList.add(
      "open"
    );

  };

</script>

</body>
  </html>
