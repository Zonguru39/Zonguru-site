<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zonguru Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6d28d9, #9333ea, #c026d3);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 410px;
      background: #ffffff;
      padding: 32px 26px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.20);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(124,58,237,0.30);
    }

    .logo h1 {
      margin: 15px 0 5px;
      color: #1f2937;
      font-size: 28px;
    }

    .logo p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
      background: #fff;
      transition: 0.2s;
    }

    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.10);
    }

    .login-btn {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 11px;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: 0.2s;
    }

    .login-btn:hover {
      opacity: 0.93;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .register-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #6b7280;
    }

    .register-link a {
      color: #7c3aed;
      font-weight: bold;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .forgot {
      text-align: right;
      margin-top: 7px;
    }

    .forgot a {
      color: #7c3aed;
      text-decoration: none;
      font-size: 13px;
    }

    .security-note {
      margin-top: 22px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <div class="logo-icon">Z</div>
      <h1>Zonguru</h1>
      <p>Welcome back</p>
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <div class="forgot">
          <a href="javascript:void(0)" onclick="showForgotMessage()">
            Forgot password?
          </a>
        </div>
      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >
        Login
      </button>

    </form>

    <div class="register-link">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <div class="security-note">
      🔒 Your account information is securely protected.
    </div>

  </div>


  <script>
    const API_URL = "https://zonguru-jack-api.onrender.com";

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    function hideMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function showForgotMessage() {
      showMessage(
        "Please contact Customer Service to reset your password.",
        "error"
      );
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      hideMessage();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showMessage("Please enter username and password.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {
        const response = await fetch(API_URL + "/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message ||
            data.error ||
            "Login failed. Please check your username and password."
          );
        }

        if (!data.token) {
          throw new Error("Login successful but token was not received.");
        }

        localStorage.setItem("zonguru_token", data.token);

        if (data.user) {
          localStorage.setItem(
            "zonguru_user",
            JSON.stringify(data.user)
          );
        }

        showMessage("Login successful. Redirecting...", "success");

        setTimeout(function() {
          window.location.href = "dashboard.html";
        }, 700);

      } catch (error) {
        console.error(error);

        showMessage(
          error.message || "Unable to connect to the server."
        );

        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }
    });
  </script>


  <!-- Customer Service + Language -->
  <script src="support.js"></script>

</body>
          </html>
