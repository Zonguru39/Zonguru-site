<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zonguru - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #6d28d9 0%, transparent 35%),
        radial-gradient(circle at bottom right, #4c1d95 0%, transparent 40%),
        linear-gradient(135deg, #12002b, #241047, #12002b);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.97);
      color: #222;
      border-radius: 24px;
      padding: 35px 28px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.35);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
      color: #1f1235;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: #fafafa;
    }

    input:focus {
      border-color: #7c3aed;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.10);
    }

    .forgot {
      text-align: right;
      margin-top: -5px;
      margin-bottom: 20px;
    }

    .forgot a {
      color: #6d28d9;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .login-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.28);
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.35);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .register-link {
      text-align: center;
      margin-top: 22px;
      color: #777;
      font-size: 14px;
    }

    .register-link a {
      color: #6d28d9;
      text-decoration: none;
      font-weight: 700;
    }

    .security {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: #999;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .login-box {
        padding: 28px 20px;
        border-radius: 20px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <div class="logo-icon">Z</div>
    </div>

    <h1>Welcome back</h1>

    <p class="subtitle">
      Login to your Zonguru account
    </p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="forgot">
        <a href="#" id="forgotPassword">
          Forgot password?
        </a>
      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>

    </form>

    <div class="register-link">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <div class="security">
      🔒 Your account information is securely protected.
    </div>

  </div>


  <script>
    const API_URL =
      "https://zonguru-jack-api.onrender.com";

    const form =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function (event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      if (!username || !password) {
        showMessage(
          "Please enter your username and password.",
          "error"
        );
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      message.className = "message";
      message.textContent = "";

      try {

        const response = await fetch(
          API_URL + "/api/auth/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              username: username,
              password: password
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message || "Login failed."
          );
        }

        if (data.token) {
          localStorage.setItem(
            "zonguru_token",
            data.token
          );
        }

        if (data.user) {
          localStorage.setItem(
            "zonguru_user",
            JSON.stringify(data.user)
          );
        }

        showMessage(
          "Login successful. Redirecting...",
          "success"
        );

        setTimeout(function () {
          window.location.href = "dashboard.html";
        }, 700);

      } catch (error) {

        showMessage(
          error.message || "Unable to login.",
          "error"
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }

    });


    document
      .getElementById("forgotPassword")
      .addEventListener("click", function (event) {

        event.preventDefault();

        alert(
          "Please contact Customer Service to reset your password."
        );

      });
  </script>


  <!-- Zonguru Customer Service + Language System -->
  <script src="support.js"></script>

</body>
</html>
