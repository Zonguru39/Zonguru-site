<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Zonguru - Login</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top left,
          #7c3aed 0%,
          transparent 35%
        ),

        radial-gradient(
          circle at bottom right,
          #4f46e5 0%,
          transparent 40%
        ),

        linear-gradient(
          135deg,
          #12002b,
          #241047,
          #12002b
        );

      color: #222;

      padding: 20px;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    /* =========================
       TOP TOOLS
    ========================= */

    .zg-tools {

      position: fixed;

      top: 15px;

      right: 15px;

      z-index: 999999;

      display: flex;

      gap: 8px;

      align-items: center;
    }


    .zg-tool-btn {

      border: 0;

      background: rgba(
        255,
        255,
        255,
        0.97
      );

      color: #4c1d95;

      padding: 10px 14px;

      border-radius: 12px;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.25);
    }


    .zg-tool-btn:hover {

      transform:
        translateY(-1px);
    }


    .zg-language-btn {

      width: 46px;

      padding: 10px 0;

      font-size: 18px;
    }


    .zg-language-menu {

      position: absolute;

      right: 0;

      top: 52px;

      width: 190px;

      display: none;

      background: white;

      border-radius: 15px;

      padding: 8px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.30);
    }


    .zg-language-menu.show {

      display: block;
    }


    .zg-language-menu button {

      width: 100%;

      border: 0;

      background: white;

      padding: 12px;

      border-radius: 10px;

      text-align: left;

      font-size: 14px;

      cursor: pointer;

      color: #333;
    }


    .zg-language-menu button:hover {

      background: #f3e8ff;

      color: #6d28d9;
    }


    /* =========================
       LOGIN BOX
    ========================= */

    .login-box {

      width: 100%;

      max-width: 430px;

      background:
        rgba(255,255,255,.97);

      border-radius: 24px;

      padding: 35px 28px;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);
    }


    .logo {

      text-align: center;

      margin-bottom: 12px;
    }


    .logo-icon {

      width: 65px;

      height: 65px;

      margin:
        0 auto 12px;

      border-radius: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #4f46e5
        );

      color: white;

      font-size: 32px;

      font-weight: 800;

      box-shadow:
        0 10px 30px

    }


    h1 {

      text-align: center;

      color: #211333;

      font-size: 28px;

      margin-bottom: 8px;
    }


    .subtitle {

      text-align: center;

      color: #777;

      font-size: 14px;

      margin-bottom: 28px;
    }


    .form-group {

      margin-bottom: 18px;
    }


    label {

      display: block;

      color: #333;

      font-size: 14px;

      font-weight: 700;

      margin-bottom: 8px;
    }


    input {

      width: 100%;

      height: 50px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      padding: 0 15px;

      background: #fafafa;

      font-size: 15px;

      outline: none;
    }


    input:focus {

      border-color: #7c3aed;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(124,58,237,.10);
    }


    .forgot {

      text-align: right;

      margin-top: -5px;

      margin-bottom: 20px;
    }


    .forgot a {

      color: #6d28d9;

      font-size: 13px;

      font-weight: 700;

      text-decoration: none;
    }


    .login-btn {

      width: 100%;

      height: 52px;

      border: 0;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #4f46e5
        );

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 10px 25px
        rgba(99,102,241,.28);
    }


    .login-btn:disabled {

      opacity: .6;

      cursor: not-allowed;
    }


    .message {

      display: none;

      padding: 12px 14px;

      border-radius: 10px;

      margin-bottom: 18px;

      font-size: 14px;

      line-height: 1.5;
    }


    .message.error {

      display: block;

      background: #fee2e2;

      color: #991b1b;
    }


    .message.success {

      display: block;

      background: #dcfce7;

      color: #166534;
    }


    .register-link {

      text-align: center;

      margin-top: 22px;

      color: #777;

      font-size: 14px;
    }


    .register-link a {

      color: #6d28d9;

      text-decoration: none;

      font-weight: 700;
    }


    .security {

      text-align: center;

      margin-top: 22px;

      color: #999;

      font-size: 12px;
    }


    /* =========================
       CHAT
    ========================= */

    .chat-overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.55);

      display: none;

      align-items: center;

      justify-content: center;

      z-index: 1000000;

      padding: 20px;
    }


    .chat-overlay.show {

      display: flex;
    }


    .chat-box {

      width: 100%;

      max-width: 420px;

      height: 600px;

      max-height: 90vh;

      background: white;

      border-radius: 20px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);
    }


    .chat-header {

      padding: 16px;

      background:
        linear-gradient(
          135deg,
          #7c3aed,
          #4f46e5
        );

      color: white;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .chat-header strong {

      font-size: 16px;
    }


    .chat-close {

      border: 0;

      background: transparent;

      color: white;

      font-size: 25px;

      cursor: pointer;
    }


    .chat-messages {

      flex: 1;

      overflow-y: auto;

      padding: 15px;

      background: #f8f7fb;
    }


    .chat-message {

      margin-bottom: 12px;

      max-width: 82%;
    }


    .chat-message.user {

      margin-left: auto;

      text-align: right;
    }


    .chat-bubble {

      display: inline-block;

      padding: 10px 13px;

      border-radius: 14px;

      font-size: 14px;

      line-height: 1.5;

      background: white;

      color: #333;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);
    }


    .chat-message.user
    .chat-bubble {

      background: #7c3aed;

      color: white;
    }


    .chat-input-area {

      display: flex;

      gap: 8px;

      padding: 12px;

      border-top:
        1px solid #eee;
    }


    .chat-input {

      flex: 1;

      height: 44px;

      border:
        1px solid #ddd;

      border-radius: 10px;

      padding: 0 12px;
    }


    .chat-send {

      width: 48px;

      border: 0;

      border-radius: 10px;

      background: #7c3aed;

      color: white;

      cursor: pointer;

      font-size: 18px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width:600px) {

      body {

        padding: 14px;
      }


      .login-box {

        padding: 28px 20px;
      }


      .zg-tools {

        top: 10px;

        right: 10px;
      }


      .zg-tool-btn {

        padding:
          9px 10px;

        font-size: 12px;
      }


      .zg-language-btn {

        width: 42px;
      }


      .chat-box {

        height: 90vh;
      }

    }

  </style>

</head>

<!-- =========================

<div class="login-box">

========================= -->

      </strong>

    </div>

      class="chat-messages"

      <div class="chat-message">

      </div>


    </div>



    <div class="chat-input-area">


      <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="Type your message...">


      <button
        type="button"
        class="chat-send"
        id="chatSend">

        ➤

      </button>


    </div>


  </div>


</div>



<script>

/* =========================================

const loginForm =

const loginBtn =

const chatSend =

const chatMessages =

/* =========================================

  },


  my: {

    title:

    subtitle:

    password:
      "စကားဝှက်",

    passwordPlaceholder:

    forgot:

/* =========================================
   APPLY LANGUAGE
========================================= */

function applyLanguage(lang) {


  const t =
    translations[lang] ||
    translations.en;


  document.documentElement.lang =
    lang;


  if (lang === "ar") {

    document.body.dir =
      "rtl";

  } else {

    document.body.dir =
      "ltr";

  }


  document.getElementById(
    "pageTitle"
  ).textContent =
    t.title;


  document.getElementById(
    "pageSubtitle"
  ).textContent =
    t.subtitle;


  document.getElementById(
    "usernameLabel"
  ).textContent =
    t.username;


  document.getElementById(
    "passwordLabel"
  ).textContent =
    t.password;


  document.getElementById(
    "username"
  ).placeholder =
    t.usernamePlaceholder;


  document.getElementById(
    "password"
  ).placeholder =
    t.passwordPlaceholder;


  document.getElementById(
    "forgotPassword"
  ).textContent =
    t.forgot;


  document.getElementById(
    "loginBtn"
  ).textContent =
    t.login;


  document.getElementById(
    "customerServiceBtn"
  ).textContent =
    t.customerService;


  document.getElementById(
    "chatTitle"
  ).textContent =
    t.chatTitle;


  document.getElementById(
    "chatInput"
  ).placeholder =
    t.chatPlaceholder;


  document.getElementById(
    "securityText"
  ).textContent =
    t.security;


  document.getElementById(
    "registerText"
  ).innerHTML =
    t.registerBefore +
    ' <a href="register.html">' +
    t.registerLink +
    "</a>";


  localStorage.setItem(
    "zonguru_lang",
    lang
  );

}



/* =========================================
   LANGUAGE BUTTON
   ONLY ONE CLICK EVENT
========================================= */

languageBtn.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    languageMenu.classList.toggle(
      "show"
    );

  }
);



/* =========================================
   LANGUAGE OPTIONS
========================================= */

const languageButtons =
  languageMenu.querySelectorAll(
    "button"
  );


languageButtons.forEach(
  function(button) {

    button.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        const lang =
          button.getAttribute(
            "data-lang"
          );


        applyLanguage(
          lang
        );


        languageMenu.classList.remove(
          "show"
        );

      }
    );

  }
);



/* =========================================
   CLOSE LANGUAGE MENU
   ONLY WHEN CLICKING OUTSIDE
========================================= */

document.addEventListener(
  "click",
  function(event) {

    if (
      !languageMenu.contains(
        event.target
      ) &&
      event.target !== languageBtn
    ) {

      languageMenu.classList.remove(
        "show"
      );

    }

  }
);



/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
  text,
  type
) {

  messageBox.textContent =
    text;

  messageBox.className =
    "message " + type;

}



/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const username =
      document.getElementById(
        "username"
      ).value.trim();


    const password =
      document.getElementById(
        "password"
      ).value;


    if (
      !username ||
      !password
    ) {

      showMessage(
        "Please enter your username and password.",
        "error"
      );

      return;

    }


    loginBtn.disabled =
      true;


    loginBtn.textContent =
      "Logging in...";


    messageBox.className =
      "message";


    try {

  const response =
    await fetch(
      API_URL +
      "/api/auth/login",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          username: username,
          password: password
        })
      }
    );


  const data =
    await response.json();


  if (
    !response.ok ||
    !data.success
  ) {

    throw new Error(
      data.message ||
      "Login failed."
    );

  }


  if (data.token) {

    localStorage.setItem(
      "zonguru_token",
      data.token
    );

  }


  if (data.user) {

    localStorage.setItem(
      "zonguru_user",
      JSON.stringify(
        data.user
      )
    );

  }


  showMessage(
    "Login successful. Redirecting...",
    "success"
  );


  setTimeout(
    function() {

      window.location.href =
        "dashboard.html";

    },
    700
  );


} catch (error) {

  showMessage(
    error.message ||
    "Unable to login.",
    "error"
  );


  loginBtn.disabled =
    false;


  loginBtn.textContent =
    "Login";

  }

);


/* =========================================
   CUSTOMER SERVICE
========================================= */

function openChat() {

  chatOverlay.classList.add(
    "show"
  );

  setTimeout(
    function() {

      chatInput.focus();

    },
    100
  );

}


function closeChat() {

  chatOverlay.classList.remove(
    "show"
  );

}


customerServiceBtn.addEventListener(
  "click",
  function() {

    openChat();

  }
);


chatClose.addEventListener(
  "click",
  function() {

    closeChat();

  }
);


chatOverlay.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      chatOverlay
    ) {

      closeChat();

    }

  }
);


/* =========================================
   FORGOT PASSWORD
========================================= */

document
  .getElementById(
    "forgotPassword"
  )
  .addEventListener(
    "click",
    function(event) {

      event.preventDefault();

      openChat();

    }
  );


/* =========================================
   CHAT MESSAGE
========================================= */

function addChatMessage(
  text,
  sender
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "chat-message " +
    (
      sender === "user"
        ? "user"
        : ""
    );

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "chat-bubble";

  bubble.textContent =
    text;

  wrapper.appendChild(
    bubble
  );

  chatMessages.appendChild(
    wrapper
  );

  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


/* =========================================
   SEND CHAT MESSAGE
========================================= */

async function sendChatMessage() {

  const text =
    chatInput.value.trim();


  if (!text) {

    return;

  }


  addChatMessage(
    text,
    "user"
  );


  chatInput.value = "";


  const token =
    localStorage.getItem(
      "zonguru_token"
    );


  if (!token) {

    addChatMessage(
      "Please register or login first so Customer Service can assist you.",
      "admin"
    );

    return;

  }


  try {

    const response =
      await fetch(
        API_URL +
        "/api/chat/send",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + token

          },

          body: JSON.stringify({
            text: text
          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Message could not be sent."
      );

    }


  } catch (error) {

    addChatMessage(
      error.message ||
      "Customer Service is temporarily unavailable.",
      "admin"
    );

  }

}


/* =========================================
   CHAT SEND BUTTON
========================================= */

chatSend.addEventListener(
  "click",
  function() {

    sendChatMessage();

  }
);


/* =========================================
   ENTER KEY
========================================= */

chatInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendChatMessage();

    }

  }
);


/* =========================================
   INITIAL LANGUAGE
========================================= */

const savedLanguage =
  localStorage.getItem(
    "zonguru_lang"
  ) || "en";


applyLanguage(
  savedLanguage
);

</script>
