<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zonguru Register</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#16002f,#3b176d,#16002f);font-family:Arial,sans-serif;padding:70px 15px 20px}.card{max-width:440px;margin:auto;background:#fff;border-radius:22px;padding:26px 22px;box-shadow:0 15px 50px #0005}h1{text-align:center;color:#7657d9;margin:0 0 6px}.sub{text-align:center;color:#777;margin-bottom:20px}label{display:block;font-size:13px;font-weight:bold;color:#555;margin:13px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:15px}button{width:100%;padding:14px;border:0;border-radius:11px;background:#7657d9;color:#fff;font-size:16px;font-weight:bold;margin-top:15px}button:disabled{opacity:.6}.row{display:flex;gap:8px}.row input{flex:1}.row button{width:auto;margin-top:0}.msg{display:none;padding:11px;border-radius:10px;margin:12px 0;font-size:13px;font-weight:bold}.ok{display:block;background:#ecfdf5;color:#15803d}.err{display:block;background:#fef2f2;color:#dc2626}#step2{display:none}.login{text-align:center;margin-top:18px;color:#777}.login a{color:#7657d9;font-weight:bold}.top{position:fixed;top:12px;right:12px;display:flex;gap:7px}.top button{width:auto;margin:0;padding:9px 11px;background:#fff;color:#4b2c91;font-size:13px;box-shadow:0 4px 15px #0003}#jsStatus{text-align:center;font-size:11px;color:#999;margin-top:12px}</style></head><body><div class="top"><button type="button" onclick="alert('Customer Service will be available after login.')">💬 Customer Service</button><button type="button" onclick="alert('Language selector')">🌐 Language</button></div><div class="card"><h1>Zonguru</h1><div class="sub">Create your account</div><div id="msg" class="msg"></div><div id="step1"><label>Username</label><input id="username" autocomplete="username" placeholder="Enter your username"><label>Phone Number</label><input id="phone" type="tel" autocomplete="tel" placeholder="+95 9xxxxxxxxx"><label>Email Address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button id="sendBtn" type="button">Send Verification Code</button></div><div id="step2"><label>Email Verification Code</label><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button id="resendBtn" type="button">Resend</button></div><div id="timer" style="font-size:12px;color:#777;margin-top:7px"></div><label>Password</label><input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters"><label>Confirm Password</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat your password"><button id="registerBtn" type="button">Create Account</button></div><div class="login">Already have an account? <a href="login.html">Login</a></div><div id="jsStatus">Page loaded</div></div><script>(function(){"use strict";const API="https://zonguru-jack-api.onrender.com";let timerId=null,seconds=0;const $=id=>document.getElementById(id);function show(text,ok){const e=$("msg");e.textContent=text;e.className="msg "+(ok?"ok":"err");e.style.display="block"}function emailOK(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}function phoneOK(v){return String(v).replace(/\D/g,"").length>=7}function timer(n){clearInterval(timerId);seconds=n;const r=$("resendBtn");r.disabled=true;function tick(){$("timer").textContent=seconds>0?"Request another code in "+seconds+"s":"You can request a new code now.";if(seconds<=0){clearInterval(timerId);r.disabled=false}seconds--}tick();timerId=setInterval(tick,1000)}async function sendCode(){const email=$("email").value.trim().toLowerCase(),phone=$("phone").value.trim(),b=$("sendBtn"),r=$("resendBtn");if(!emailOK(email)){show("Please enter a valid email address.");return}if(!phoneOK(phone)){show("Please enter a valid phone number.");return}b.disabled=true;r.disabled=true;b.textContent="Connecting...";show("Connecting to Zonguru server...",true);try{const ping=await fetch(API+"/",{cache:"no-store"});if(!ping.ok)throw new Error("Backend returned HTTP "+ping.status);b.textContent="Sending code...";const x=await fetch(API+"/api/auth/send-email-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email,phone:phone}),cache:"no-store"});const d=await x.json().catch(()=>({}));if(!x.ok||!d.success)throw new Error(d.message||("Server returned HTTP "+x.status));show("Verification code sent. Check your email.",true);$("step1").style.display="none";$("step2").style.display="block";$("code").focus();timer(60)}catch(e){show("Error: "+(e&&e.message?e.message:"Unable to connect to server."))}finally{b.disabled=false;b.textContent="Send Verification Code";if(seconds<=0)r.disabled=false}}async function register(){const username=$("username").value.trim(),phone=$("phone").value.trim(),email=$("email").value.trim().toLowerCase(),code=$("code").value.trim(),password=$("password").value,confirm=$("confirm").value,b=$("registerBtn");if(username.length<3)return show("Username must contain at least 3 characters.");if(!phoneOK(phone))return show("Please enter a valid phone number.");if(!emailOK(email))return show("Please enter a valid email address.");if(!/^\d{6}$/.test(code))return show("Enter the 6-digit email verification code.");if(password.length<6)return show("Password must contain at least 6 characters.");if(password!==confirm)return show("Passwords do not match.");b.disabled=true;b.textContent="Creating...";try{const x=await fetch(API+"/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,phone,email,emailCode:code,password}),cache:"no-store"});const d=await x.json().catch(()=>({}));if(!x.ok||!d.success)throw new Error(d.message||("Server returned HTTP "+x.status));localStorage.setItem("zonguru_token",d.token);localStorage.setItem("zonguru_user",JSON.stringify(d.user));show("Registration successful. Opening dashboard...",true);setTimeout(()=>location.href="dashboard.html",700)}catch(e){show("Error: "+(e&&e.message?e.message:"Registration failed."));b.disabled=false;b.textContent="Create Account"}}$("sendBtn").addEventListener("click",sendCode);$("resendBtn").addEventListener("click",sendCode);$("registerBtn").addEventListener("click",register);$("jsStatus").textContent="JavaScript ready ✓";window.sendCode=sendCode})();</script></body></html>
