<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zonguru Register</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#ffcc8a55,transparent 28%),radial-gradient(circle at 90% 80%,#49c8bd55,transparent 30%),linear-gradient(135deg,#17112b,#4a2778 52%,#111b35);font-family:Arial,sans-serif;padding:34px 15px 24px;color:#222}.card{max-width:470px;margin:auto;background:#fff;border-radius:28px;padding:28px 22px 24px;box-shadow:0 25px 70px #0005;border:1px solid #ffffffaa}.brand-lockup{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 9px}.z-logo-mark{width:60px;height:60px;filter:drop-shadow(0 8px 14px rgba(20,40,60,.18))}.brand-name{font-size:28px;font-weight:900;letter-spacing:2px}.brand-name span{color:#ef5570}.sub{text-align:center;color:#777;font-size:14px;margin-bottom:20px}.badge{width:max-content;margin:0 auto 10px;padding:7px 12px;border-radius:999px;background:#f3f0ff;color:#6542bd;font-size:11px;font-weight:800}.form-head{background:linear-gradient(135deg,#f7f4ff,#fff6f2);border:1px solid #eee5ff;border-radius:16px;padding:13px;margin-bottom:8px;color:#5a467f;font-size:12px}.login{text-align:center;color:#777;margin-top:18px}.login a{color:#7657d9;font-weight:bold}.field{margin-top:2px}label{display:block;font-size:13px;font-weight:bold;color:#555;margin:13px 0 6px}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:15px;background:#fff;outline:none;transition:.2s}input:focus,select:focus{border-color:#7657d9;box-shadow:0 0 0 3px #7657d91a}.phone{display:grid;grid-template-columns:150px 1fr;gap:8px}button{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#7657d9,#4f46e5);color:#fff;font-size:16px;font-weight:bold;margin-top:15px;box-shadow:0 8px 18px #7657d933}button:disabled{opacity:.6}.msg{display:none;padding:11px;border-radius:10px;margin:12px 0;font-size:13px;font-weight:bold}.ok{display:block;background:#ecfdf5;color:#15803d}.err{display:block;background:#fef2f2;color:#dc2626}.hint{font-size:12px;color:#888;margin-top:5px}@media(max-width:520px){body{padding:20px 11px}.card{padding:24px 17px;border-radius:24px}.phone{grid-template-columns:1fr 1.15fr}.brand-name{font-size:25px}.z-logo-mark{width:55px;height:55px}}</style></head><body>
<div class="card"><div class="brand-lockup"><svg class="z-logo-mark" viewBox="0 0 64 64" aria-label="Zonguru logo"><defs><linearGradient id="zga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc542"/><stop offset=".52" stop-color="#ff7b19"/><stop offset="1" stop-color="#ff3e1d"/></linearGradient><linearGradient id="zgt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35c6bd"/><stop offset="1" stop-color="#0796c7"/></linearGradient></defs><path d="M10 40C15 18 34 7 49 12c5 2 7 6 5 10-4 7-15 13-25 17-8 3-14 5-19 1Z" fill="url(#zga)"/><path d="M33 31c7-3 15-8 19-15 7 6 9 15 5 25-3 8-10 13-18 15l-7-7c7-5 10-10 1-18Z" fill="url(#zgt)"/><path d="M36 38c6 3 11 7 13 13M40 31c7 3 12 6 15 12M44 24c6 2 11 5 15 10" fill="none" stroke="#087f91" stroke-width="3.2" stroke-linecap="round" opacity=".8"/></svg><div class="brand-name">ZONG<span>URU</span></div></div><div class="badge">✦ Create your secure account</div><div class="sub">Join Zonguru and manage your account in one place.</div><div class="form-head">🔐 No email verification required. Your account is created immediately after registration.</div><div id="msg" class="msg"></div>
<form id="f"><label>Username</label><input id="u" required placeholder="Enter your username">
<label>Phone Number</label><div class="phone"><select id="cc"><option value="+52" data-ex="612 345 6789">🇲🇽 Mexico (+52)</option><option value="+1" data-ex="415 555 0123">🇺🇸 United States (+1)</option><option value="+44" data-ex="7400 123456">🇬🇧 United Kingdom (+44)</option><option value="+1" data-ex="416 555 0123">🇨🇦 Canada (+1)</option><option value="+34" data-ex="612 345 678">🇪🇸 Spain (+34)</option><option value="+966" data-ex="50 123 4567">🇸🇦 Saudi Arabia (+966)</option><option value="+971" data-ex="50 123 4567">🇦🇪 UAE (+971)</option><option value="+20" data-ex="10 1234 5678">🇪🇬 Egypt (+20)</option><option value="+33" data-ex="6 12 34 56 78">🇫🇷 France (+33)</option><option value="+49" data-ex="151 23456789">🇩🇪 Germany (+49)</option><option value="+39" data-ex="312 345 6789">🇮🇹 Italy (+39)</option><option value="+351" data-ex="912 345 678">🇵🇹 Portugal (+351)</option><option value="+31" data-ex="6 12345678">🇳🇱 Netherlands (+31)</option><option value="+41" data-ex="79 123 45 67">🇨🇭 Switzerland (+41)</option><option value="+46" data-ex="70 123 45 67">🇸🇪 Sweden (+46)</option><option value="+47" data-ex="412 34 567">🇳🇴 Norway (+47)</option><option value="+48" data-ex="512 345 678">🇵🇱 Poland (+48)</option><option value="+90" data-ex="532 123 4567">🇹🇷 Türkiye (+90)</option><option value="+972" data-ex="50 123 4567">🇮🇱 Israel (+972)</option><option value="+91" data-ex="98765 43210">🇮🇳 India (+91)</option><option value="+86" data-ex="138 0013 8000">🇨🇳 China (+86)</option><option value="+81" data-ex="90 1234 5678">🇯🇵 Japan (+81)</option><option value="+82" data-ex="10 1234 5678">🇰🇷 South Korea (+82)</option><option value="+65" data-ex="8123 4567">🇸🇬 Singapore (+65)</option><option value="+60" data-ex="12 345 6789">🇲🇾 Malaysia (+60)</option><option value="+66" data-ex="81 234 5678">🇹🇭 Thailand (+66)</option><option value="+84" data-ex="91 234 5678">🇻🇳 Vietnam (+84)</option><option value="+62" data-ex="812 3456 7890">🇮🇩 Indonesia (+62)</option><option value="+63" data-ex="917 123 4567">🇵🇭 Philippines (+63)</option><option value="+880" data-ex="1812 345678">🇧🇩 Bangladesh (+880)</option><option value="+92" data-ex="300 1234567">🇵🇰 Pakistan (+92)</option><option value="+94" data-ex="71 234 5678">🇱🇰 Sri Lanka (+94)</option><option value="+95" data-ex="9 123456789">🇲🇲 Myanmar (+95)</option><option value="+61" data-ex="412 345 678">🇦🇺 Australia (+61)</option><option value="+64" data-ex="21 123 4567">🇳🇿 New Zealand (+64)</option><option value="+55" data-ex="11 91234 5678">🇧🇷 Brazil (+55)</option><option value="+54" data-ex="9 11 2345 6789">🇦🇷 Argentina (+54)</option><option value="+56" data-ex="9 1234 5678">🇨🇱 Chile (+56)</option><option value="+57" data-ex="300 1234567">🇨🇴 Colombia (+57)</option><option value="+51" data-ex="912 345 678">🇵🇪 Peru (+51)</option><option value="+27" data-ex="82 123 4567">🇿🇦 South Africa (+27)</option><option value="+234" data-ex="801 234 5678">🇳🇬 Nigeria (+234)</option><option value="+254" data-ex="712 345678">🇰🇪 Kenya (+254)</option></select><input id="p" type="tel" required></div><div id="hint" class="hint"></div>
<label>Email / Gmail</label><input id="e" type="email" required placeholder="you@gmail.com">
<label>Password</label><input id="pw" type="password" required placeholder="At least 6 characters">
<label>Confirm Password</label><input id="cf" type="password" required placeholder="Repeat your password">
<button id="b">Create Account</button></form><div class="login">Already have an account? <a href="login.html">Login</a></div></div>
<script>
const A="https://zonguru-jack-api.onrender.com",q=x=>document.getElementById(x),cc=q("cc"),p=q("p");
function ex(){let o=cc.options[cc.selectedIndex];p.placeholder=o.dataset.ex;q("hint").textContent="Example: "+cc.value+" "+o.dataset.ex}cc.onchange=ex;ex();
q("f").onsubmit=async e=>{e.preventDefault();let u=q("u").value.trim(),phone=cc.value+" "+p.value.trim(),email=q("e").value.trim().toLowerCase(),pw=q("pw").value,cf=q("cf").value,b=q("b"),m=q("msg");if(u.length<3)return show("Username must contain at least 3 characters.");if(p.value.replace(/\D/g,"").length<6)return show("Please enter a valid phone number.");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return show("Please enter a valid email address.");if(pw.length<6)return show("Password must contain at least 6 characters.");if(pw!==cf)return show("Passwords do not match.");b.disabled=true;b.textContent="Creating account...";try{let r=await fetch(A+"/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,phone,email,password:pw})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.message||("Server returned HTTP "+r.status));localStorage.setItem("zonguru_token",d.token);localStorage.setItem("zonguru_user",JSON.stringify(d.user));show("Account created successfully. Opening dashboard...",true);setTimeout(()=>location.href="dashboard.html",500)}catch(x){show("Error: "+x.message);b.disabled=false;b.textContent="Create Account"}};
function show(t,ok=false){let m=q("msg");m.textContent=t;m.className="msg "+(ok?"ok":"err");m.style.display="block"}
</script></body></html>
