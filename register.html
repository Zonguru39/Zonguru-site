<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Zonguru Register</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(
      135deg,
      #16002f,
      #3b176d,
      #16002f
    );
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#222;
}

.register-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:22px;
  padding:30px 24px;
  box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  margin-bottom:8px;
  color:#7657d9;
  font-size:32px;
  font-weight:bold;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
  font-size:14px;
}

.form-group{
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  color:#555;
  margin-bottom:7px;
}

.input-wrap{
  position:relative;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:11px;
  font-size:15px;
  outline:none;
  background:#fff;
}

input:focus{
  border-color:#7657d9;
  box-shadow:0 0 0 3px rgba(118,87,217,.1);
}

.password-input{
  padding-right:55px;
}

.show-password{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  color:#7657d9;
  border:0;
  padding:8px;
  font-size:12px;
  cursor:pointer;
}

.register-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#7657d9;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.register-btn:disabled{
  opacity:.6;
}

.login-link{
  text-align:center;
  margin-top:18px;
  font-size:14px;
  color:#777;
}

.login-link a{
  color:#7657d9;
  font-weight:bold;
  text-decoration:none;
}

.security{
  text-align:center;
  margin-top:20px;
  color:#999;
  font-size:12px;
}

.success,
.error{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:13px;
  font-weight:bold;
}

.success{
  background:#ecfdf5;
  color:#15803d;
}

.error{
  background:#fef2f2;
  color:#dc2626;
}


/* ================= TOP TOOLS ================= */

.top-tools{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  gap:8px;
  z-index:5000;
}

.tool-btn{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  background:rgba(255,255,255,.95);
  color:#4b2c91;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.tool-btn:hover{
  background:#fff;
}


/* ================= LANGUAGE ================= */

.language-wrap{
  position:relative;
}

.language-menu{
  display:none;
  position:absolute;
  top:48px;
  right:0;
  width:170px;
  background:#fff;
  border-radius:12px;
  padding:7px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.language-menu.show{
  display:block;
}

.language-item{
  width:100%;
  border:0;
  background:#fff;
  text-align:left;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

.language-item:hover{
  background:#f3efff;
  color:#7657d9;
}


/* ================= CHAT ================= */

.chat-box{
  display:none;
  position:fixed;
  right:15px;
  bottom:20px;
  width:340px;
  max-width:calc(100vw - 30px);
  background:#fff;
  border-radius:18px;
  box-shadow:0 12px 45px rgba(0,0,0,.3);
  overflow:hidden;
  z-index:6000;
}

.chat-box.show{
  display:block;
}

.chat-header{
  background:linear-gradient(
    135deg,
    #7657d9,
    #6242c5
  );
  color:#fff;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.chat-title{
  font-weight:bold;
}

.chat-close{
  border:0;
  background:transparent;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.chat-body{
  height:280px;
  overflow-y:auto;
  padding:12px;
  background:#f6f5fa;
}

.chat-message{
  max-width:85%;
  padding:10px 12px;
  border-radius:12px;
  margin-bottom:9px;
  font-size:13px;
  line-height:1.4;
}

.chat-message.support{
  background:#fff;
  color:#333;
  border:1px solid #eee;
}

.chat-message.user{
  margin-left:auto;
  background:#7657d9;
  color:#fff;
}

.chat-footer{
  padding:10px;
  display:flex;
  gap:7px;
  border-top:1px solid #eee;
}

.chat-input{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  outline:none;
  font-size:13px;
}

.chat-send{
  border:0;
  background:#7657d9;
  color:#fff;
  border-radius:10px;
  padding:0 14px;
  cursor:pointer;
  font-weight:bold;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

  body{
    padding:15px;
    align-items:flex-start;
    padding-top:85px;
  }

  .register-box{
    margin-bottom:30px;
    padding:25px 18px;
  }

  .top-tools{
    top:12px;
    right:10px;
  }

  .tool-btn{
    padding:9px 10px;
    font-size:11px;
  }

  .chat-box{
    bottom:15px;
    right:10px;
    width:calc(100vw - 20px);
  }

}
</style>
</head>

<body>


<!-- ================= TOP TOOLS ================= -->

<div class="top-tools">

  <button
    id="customerServiceBtn"
    class="tool-btn"
    onclick="toggleChat()">

    💬 Customer Service

  </button>


  <div class="language-wrap">

    <button
      class="tool-btn"
      onclick="toggleLanguage()">

      🌐 Language

    </button>


    <div
      id="languageMenu"
      class="language-menu">

      <button
        class="language-item"
        onclick="setLanguage('en')">

        🇬🇧 English

      </button>

      <button
        class="language-item"
        onclick="setLanguage('es')">

        🇪🇸 Español

      </button>

      <button
        class="language-item"
        onclick="setLanguage('pt')">

        🇧🇷 Português

      </button>

      <button
        class="language-item"
        onclick="setLanguage('my')">

        🇲🇲 မြန်မာ

      </button>

      <button
        class="language-item"
        onclick="setLanguage('ar')">

        🇸🇦 العربية

      </button>

    </div>

  </div>

</div>


<!-- ================= REGISTER ================= -->

<div class="register-box">

  <div class="logo">
    Zonguru
  </div>

  <div
    id="subtitle"
    class="subtitle">

    Create your account

  </div>


  <div
    id="successBox"
    class="success">
  </div>


  <div
    id="errorBox"
    class="error">
  </div>


  <form
    id="registerForm"
    onsubmit="registerUser(event)">


    <div class="form-group">

      <label id="usernameLabel">
        Username
      </label>

      <input
        id="username"
        type="text"
        autocomplete="username"
        placeholder="Enter your username"
        required>

    </div>


    <div class="form-group">

      <label id="passwordLabel">
        Password
      </label>

      <div class="input-wrap">

        <input
          id="password"
          class="password-input"
          type="password"
          autocomplete="new-password"
          placeholder="Enter your password"
          required>

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('password',this)">

          Show

        </button>

      </div>

    </div>


    <div class="form-group">

      <label id="confirmPasswordLabel">
        Confirm Password
      </label>

      <div class="input-wrap">

        <input
          id="confirmPassword"
          class="password-input"
          type="password"
          autocomplete="new-password"
          placeholder="Confirm your password"
          required>

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('confirmPassword',this)">

          Show

        </button>

      </div>

    </div>


    <button
      id="registerButton"
      class="register-btn"
      type="submit">

      Create Account

    </button>

  </form>


  <div class="login-link">

    <span id="alreadyText">
      Already have an account?
    </span>

    <a
      id="loginLink"
      href="login.html">

      Login

    </a>

  </div>


  <div
    id="securityText"
    class="security">

    🔒 Your account information is securely protected.

  </div>

</div>


<!-- ================= CUSTOMER SERVICE CHAT ================= -->

<div
  id="chatBox"
  class="chat-box">

  <div class="chat-header">

    <div
      id="chatTitle"
      class="chat-title">

      Customer Service

    </div>

    <button
      class="chat-close"
      onclick="toggleChat()">

      ×

    </button>

  </div>


  <div
    id="chatBody"
    class="chat-body">

    <div
      id="welcomeMessage"
      class="chat-message support">

      Hello! 👋 How can we help you?

    </div>

  </div>


  <div class="chat-footer">

    <input
      id="chatInput"
      class="chat-input"
      type="text"
      placeholder="Type your message..."
      onkeydown="if(event.key==='Enter') sendChat()">

    <button
      class="chat-send"
      onclick="sendChat()">

      Send

    </button>

  </div>

</div>


<script>

/* =====================================================
   ZONGURU REGISTER
===================================================== */

const API_URL =
  "https://zonguru-jack-api.onrender.com";


/* ================= TRANSLATIONS ================= */

const translations = {

  en:{
    subtitle:"Create your account",
    username:"Username",
    usernamePlaceholder:"Enter your username",
    password:"Password",
    passwordPlaceholder:"Enter your password",
    confirmPassword:"Confirm Password",
    confirmPlaceholder:"Confirm your password",
    create:"Create Account",
    already:"Already have an account?",
    login:"Login",
    security:"🔒 Your account information is securely protected.",
    customer:"💬 Customer Service",
    language:"🌐 Language",
    chatTitle:"Customer Service",
    chatWelcome:"Hello! 👋 How can we help you?",
    chatPlaceholder:"Type your message...",
    send:"Send",
    show:"Show",
    hide:"Hide"
  },

  es:{
    subtitle:"Crea tu cuenta",
    username:"Usuario",

    password:"Contraseña",
    passwordPlaceholder:"Introduce tu contraseña",
    confirmPassword:"Confirmar contraseña",
    confirmPlaceholder:"Confirma tu contraseña",
    create:"Crear cuenta",
    already:"¿Ya tienes una cuenta?",
    login:"Iniciar sesión",
    security:"🔒 La información de tu cuenta está protegida.",
    customer:"💬 Atención al cliente",
    language:"🌐 Idioma",
    chatTitle:"Atención al cliente",
    chatWelcome:"¡Hola! 👋 ¿Cómo podemos ayudarte?",
    chatPlaceholder:"Escribe tu mensaje...",
    send:"Enviar",
    show:"Mostrar",
    hide:"Ocultar"
  },

  pt:{
    subtitle:"Crie sua conta",
    username:"Usuário",
    usernamePlaceholder:"Digite seu usuário",
    password:"Senha",
    passwordPlaceholder:"Digite sua senha",
    confirmPassword:"Confirmar senha",
    confirmPlaceholder:"Confirme sua senha",
    create:"Criar conta",
    already:"Já tem uma conta?",
    login:"Entrar",
    security:"🔒 As informações da sua conta estão protegidas.",
    customer:"💬 Atendimento",
    language:"🌐 Idioma",
    chatTitle:"Atendimento ao cliente",
    chatWelcome:"Olá! 👋 Como podemos ajudar?",
    chatPlaceholder:"Digite sua mensagem...",
    send:"Enviar",
    show:"Mostrar",
    hide:"Ocultar"
  },

  my:{
    subtitle:"သင့်အကောင့် ဖန်တီးပါ",
    username:"အသုံးပြုသူအမည်",
    usernamePlaceholder:"အသုံးပြုသူအမည်ထည့်ပါ",
    password:"စကားဝှက်",
    passwordPlaceholder:"စကားဝှက်ထည့်ပါ",
    confirmPassword:"စကားဝှက်အတည်ပြုပါ",
    confirmPlaceholder:"စကားဝှက်ပြန်ထည့်ပါ",
    create:"အကောင့်ဖန်တီးမည်",
    already:"အကောင့်ရှိပြီးသားလား?",
    login:"ဝင်ရောက်မည်",
    security:"🔒 သင့်အကောင့်အချက်အလက်များကို လုံခြုံစွာကာကွယ်ထားပါသည်။",
    customer:"💬 Customer Service",
    language:"🌐 ဘာသာစကား",
    chatTitle:"Customer Service",
    chatWelcome:"မင်္ဂလာပါ 👋 ဘာကူညီပေးရမလဲ?",
    chatPlaceholder:"စာရိုက်ပါ...",
    send:"ပို့မည်",
    show:"ပြမည်",
    hide:"ဖျောက်မည်"
  },

  ar:{
    subtitle:"أنشئ حسابك",
    username:"اسم المستخدم",
    usernamePlaceholder:"أدخل اسم المستخدم",
    password:"كلمة المرور",
    passwordPlaceholder:"أدخل كلمة المرور",
    confirmPassword:"تأكيد كلمة المرور",
    confirmPlaceholder:"أكد كلمة المرور",
    create:"إنشاء الحساب",
    already:"لديك حساب بالفعل؟",
    login:"تسجيل الدخول",
    security:"🔒 معلومات حسابك محمية بشكل آمن.",
    customer:"💬 خدمة العملاء",
    language:"🌐 اللغة",
    chatTitle:"خدمة العملاء",
    chatWelcome:"مرحباً! 👋 كيف يمكننا مساعدتك؟",
    chatPlaceholder:"اكتب رسالتك...",
    send:"إرسال",
    show:"إظهار",
    hide:"إخفاء"
  }

};


/* ================= LANGUAGE ================= */

let currentLanguage =
  localStorage.getItem("zonguru_lang") || "en";


function toggleLanguage(){

  const menu =
    document.getElementById(
      "languageMenu"
    );

  menu.classList.toggle("show");

}


function setLanguage(lang){

  if(!translations[lang]){
    lang = "en";
  }

  currentLanguage = lang;

  localStorage.setItem(
    "zonguru_lang",
    lang
  );

  applyLanguage();

  document
    .getElementById("languageMenu")
    .classList.remove("show");

}


function applyLanguage(){

  const t =
    translations[currentLanguage];


  document
    .getElementById("subtitle")
    .textContent =
    t.subtitle;


  document
    .getElementById("usernameLabel")
    .textContent =
    t.username;


  document
    .getElementById("username")
    .placeholder =
    t.usernamePlaceholder;


  document
    .getElementById("passwordLabel")
    .textContent =
    t.password;


  document
    .getElementById("password")
    .placeholder =
    t.passwordPlaceholder;


  document
    .getElementById("confirmPasswordLabel")
    .textContent =
    t.confirmPassword;


  document
    .getElementById("confirmPassword")
    .placeholder =
    t.confirmPlaceholder;


  document
    .getElementById("registerButton")
    .textContent =
    t.create;


  document
    .getElementById("alreadyText")
    .textContent =
    t.already + " ";


  document
    .getElementById("loginLink")
    .textContent =
    t.login;


  document
    .getElementById("securityText")
    .textContent =
    t.security;


  document
    .getElementById("customerServiceBtn")
    .textContent =
    t.customer;


  document
    .getElementById("chatTitle")
    .textContent =
    t.chatTitle;


  document
    .getElementById("chatInput")
    .placeholder =
    t.chatPlaceholder;


  document
    .querySelector(".chat-send")
    .textContent =
    t.send;


  const welcome =
    document.getElementById(
      "welcomeMessage"
    );

  if(welcome){

    welcome.textContent =
      t.chatWelcome;

  }


  document
    .querySelectorAll(
      ".show-password"
    )
    .forEach(button => {

      const input =
        button.previousElementSibling;

      button.textContent =
        input.type === "password"
          ? t.show
          : t.hide;

    });


  document.documentElement.dir =
    currentLanguage === "ar"
      ? "rtl"
      : "ltr";

}


/* ================= PASSWORD ================= */

function togglePassword(
  id,
  button
){

  const input =
    document.getElementById(id);

  const t =
    translations[currentLanguage];


  if(input.type === "password"){

    input.type = "text";

    button.textContent =
      t.hide;

  }else{

    input.type = "password";

    button.textContent =
      t.show;

  }

}


/* ================= REGISTER ================= */

async function registerUser(event){

  event.preventDefault();


  const username =
    document
      .getElementById("username")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const confirmPassword =
    document
      .getElementById("confirmPassword")
      .value;


  const errorBox =
    document.getElementById(
      "errorBox"
    );


  const successBox =
    document.getElementById(
      "successBox"
    );


  const button =
    document.getElementById(
      "registerButton"
    );


  errorBox.style.display =
    "none";

  successBox.style.display =
    "none";


  if(!username){

    errorBox.textContent =
      "Please enter a username.";

    errorBox.style.display =
      "block";

    return;

  }


  if(username.length < 3){

    errorBox.textContent =
      "Username must be at least 3 characters.";

    errorBox.style.display =
      "block";

    return;

  }


  if(!password){

    errorBox.textContent =
      "Please enter a password.";

    errorBox.style.display =
      "block";

    return;

  }


  if(password.length < 6){

    errorBox.textContent =
      "Password must be at least 6 characters.";

    errorBox.style.display =
      "block";

    return;

  }


  if(password !== confirmPassword){

    errorBox.textContent =
      "Passwords do not match.";

    errorBox.style.display =
      "block";

    return;

  }


  button.disabled = true;

  button.textContent =
    "Creating...";


  try{

    const response =
      await fetch(
        API_URL +
        "/api/auth/register",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            username,

            password

          })

        }
      );


    let data = {};

    try{

      data =
        await response.json();

    }catch(e){

      data = {};

    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Registration failed."
      );

    }


    if(data.token){

      localStorage.setItem(
        "zonguru_token",
        data.token
      );

    }


    if(data.user){

      localStorage.setItem(
        "zonguru_user",
        JSON.stringify(
          data.user
        )
      );

    }


    successBox.textContent =
      data.message ||
      "Account created successfully.";

    successBox.style.display =
      "block";


    setTimeout(() => {

      window.location.href =
        "dashboard.html";

    },1000);


  }catch(error){

    errorBox.textContent =
      error.message ||
      "Registration failed.";

    errorBox.style.display =
      "block";


    button.disabled = false;

    button.textContent =
      translations[
        currentLanguage
      ].create;

  }

}


/* ================= CUSTOMER SERVICE ================= */

function toggleChat(){

  const chat =
    document.getElementById(
      "chatBox"
    );

  chat.classList.toggle("show");

}


function sendChat(){

  const input =
    document.getElementById(
      "chatInput"
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  const body =
    document.getElementById(
      "chatBody"
    );


  const message =
    document.createElement(
      "div"
    );


  message.className =
    "chat-message user";


  message.textContent =
    text;


  body.appendChild(
    message
  );


  input.value = "";


  body.scrollTop =
    body.scrollHeight;


  /*
    The current backend does not yet
    expose the guest-chat endpoint.

    This UI is ready for the backend
    live-chat connection.
  */

  setTimeout(() => {

    const reply =
      document.createElement(
        "div"
      );


    reply.className =
      "chat-message support";


    reply.textContent =
      currentLanguage === "my"
        ? "ကျေးဇူးတင်ပါတယ်။ Customer Service မှ ပြန်လည်ဆက်သွယ်ပေးပါမယ်။"
        : "Thank you. Our Customer Service team will assist you shortly.";


    body.appendChild(
      reply
    );


    body.scrollTop =
      body.scrollHeight;

  },700);

}

/* ================= CLOSE LANGUAGE ================= */

document.addEventListener(
  "click",
  function(event){

    const wrap =
      document.querySelector(
        ".language-wrap"
      );

    if(
      wrap &&
      !wrap.contains(
        event.target
      )
    ){

      const menu =
        document.getElementById(
          "languageMenu"
        );

      if(menu){

        menu.style.display =
          "none";

      }

    }

  }
);


/* ================= CLOSE CHAT ================= */

document.addEventListener(
  "click",
  function(event){

    const chat =
      document.querySelector(
        ".chat-box"
      );

    const chatButton =
      document.querySelector(
        "#supportButton"
      );

    if(
      chat &&
      chatButton &&
      !chat.contains(event.target) &&
      !chatButton.contains(event.target)
    ){

      chat.style.display =
        "none";

    }

  }
);


/* ================= ESC KEY ================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      const menu =
        document.getElementById(
          "languageMenu"
        );

      if(menu){

        menu.style.display =
          "none";

      }


      const chat =
        document.querySelector(
          ".chat-box"
        );

      if(chat){

        chat.style.display =
          "none";

      }

    }

  }
);


/* ================= INIT ================= */

function initSupport(){

  try{

    const savedLanguage =
      localStorage.getItem(
        "zonguru_lang"
      ) || "en";


    if(
      typeof applyLanguage ===
      "function"
    ){

      applyLanguage(
        savedLanguage
      );

    }

  }catch(error){

    console.error(
      "Support initialization error:",
      error
    );

  }

}


if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    initSupport
  );

}else{

  initSupport();

}


/* ================= DONE ================= */

})();
