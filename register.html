<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zonguru Register</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6d28d9, #9333ea, #c026d3);
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      padding: 32px 26px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.20);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 20px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(124,58,237,0.30);
    }

    .logo h1 {
      margin: 15px 0 5px;
      color: #1f2937;
      font-size: 28px;
    }

    .logo p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
      background: #fff;
      transition: 0.2s;
    }

    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.10);
    }

    .register-btn {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 11px;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: 0.2s;
    }

    .register-btn:hover {
      opacity: 0.93;
      transform: translateY(-1px);
    }

    .register-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #6b7280;
    }

    .login-link a {
      color: #7c3aed;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .terms {
      margin-top: 18px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="logo">
      <div class="logo-icon">Z</div>

      <h1>Zonguru</h1>

      <p>Create your account</p>
    </div>


    <div id="message" class="message"></div>


    <form id="registerForm">

      <div class="form-group">
        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter username"
          autocomplete="username"
          minlength="3"
          required
        >
      </div>


      <div class="form-group">
        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create password"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>


      <div class="form-group">
        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm password"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>


      <button
        type="submit"
        class="register-btn"
        id="registerButton"
      >
        Create Account
      </button>

    </form>


    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>


    <div class="terms">
      🔒 Your account information is securely protected.
    </div>

  </div>


  <script>
    const API_URL =
      "https://zonguru-jack-api.onrender.com";

    const registerForm =
      document.getElementById("registerForm");

    const registerButton =
      document.getElementById("registerButton");

    const messageBox =
      document.getElementById("message");


    function showMessage(text, type = "error") {

      messageBox.textContent = text;

      messageBox.className =
        "message " + type;
    }


    function hideMessage() {

      messageBox.textContent = "";

      messageBox.className = "message";
    }


    registerForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        hideMessage();


        const username =
          document
            .getElementById("username")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        if (!username || !password || !confirmPassword) {

          showMessage(
            "Please complete all fields."
          );

          return;
        }


        if (username.length < 3) {

          showMessage(
            "Username must be at least 3 characters."
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters."
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match."
          );

          return;
        }


        registerButton.disabled = true;

        registerButton.textContent =
          "Creating Account...";


        try {

          const response =
            await fetch(
              API_URL + "/api/auth/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  username: username,
                  password: password
                })
              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.success
          ) {

            throw new Error(
              data.message ||
              data.error ||
              "Registration failed."
            );
          }


          if (data.token) {

            localStorage.setItem(
              "zonguru_token",
              data.token
            );
          }


          if (data.user) {

            localStorage.setItem(
              "zonguru_user",
              JSON.stringify(data.user)
            );
          }


          showMessage(
            "Account created successfully. Redirecting...",
            "success"
          );


          setTimeout(function() {

            window.location.href =
              "dashboard.html";

          }, 800);


        } catch (error) {

          console.error(error);


          showMessage(
            error.message ||
            "Unable to connect to the server."
          );


          registerButton.disabled = false;

          registerButton.textContent =
            "Create Account";
        }

      }
    );
  </script>


  <!-- Customer Service + Language -->
  <script src="support.js"></script>

</body>
</html>
