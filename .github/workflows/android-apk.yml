name: Build Zonguru Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**.html","**.js","**.css","package.json","capacitor.config.json",".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node scripts/prepare-capacitor.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          gh release create "$VERSION" android/app/build/outputs/apk/debug/app-debug.apk             --title "Zonguru Android $VERSION"             --notes "Installable Zonguru Android APK built automatically from main."
