name: Build Zonguru Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**.html","**.js","**.css","package.json","capacitor.config.json",".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Prepare Capacitor web assets
        run: node scripts/prepare-capacitor.js
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply Zonguru app icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/zonguru_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="64" android:viewportHeight="64">
            <path android:fillColor="#FF7B19" android:pathData="M10,40 C15,18 34,7 49,12 C54,14 56,18 54,22 C50,29 39,35 29,39 C21,42 15,45 10,40 Z"/>
            <path android:fillColor="#0796C7" android:pathData="M33,31 C40,28 48,23 52,16 C59,22 61,31 57,41 C54,49 47,54 39,56 L32,49 C39,44 42,39 33,31 Z"/>
            <path android:fillColor="#087F91" android:pathData="M36,36 L39,35 L51,49 L49,51 Z M40,29 L43,28 L57,40 L55,43 Z M44,22 L47,21 L61,31 L59,34 Z"/>
          </vector>
          EOF
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/zonguru_logo"#' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          gh release create "$VERSION" android/app/build/outputs/apk/debug/app-debug.apk --title "Zonguru Android $VERSION" --notes "Installable Zonguru Android APK built automatically from main."
