<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zonguru Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6fb;
      color: #222;
    }

    .top {
      background: #7657d9;
      color: white;
      padding: 20px;
    }

    .top h2 {
      margin: 0 0 5px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .balance {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    .balance-title {
      color: #777;
      font-size: 14px;
    }

    .amount {
      font-size: 34px;
      font-weight: bold;
      margin-top: 8px;
    }

    .currency {
      color: #7657d9;
      font-size: 15px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .deposit {
      background: #16a34a;
      color: white;
    }

    .withdraw {
      background: #dc2626;
      color: white;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .card h3 {
      margin-top: 0;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .logout {
      width: 100%;
      background: #222;
      color: white;
    }

    .loading {
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="top">
    <h2>Zonguru</h2>
    <div id="welcomeText">Welcome to your dashboard</div>
  </div>

  <div class="container">

    <!-- Balance -->
    <div class="balance">

      <div class="balance-title">
        Available Balance
      </div>

      <div class="amount">
        <span id="balanceAmount">0.00</span>
        <span id="currency" class="currency">USDT</span>
      </div>

    </div>


    <!-- Deposit / Withdraw -->
    <div class="buttons">

      <button
        class="deposit"
        onclick="deposit()">
        Deposit
      </button>

      <button
        class="withdraw"
        onclick="withdraw()">
        Withdraw
      </button>

    </div>


    <!-- Account -->
    <div class="card">

      <h3>Account</h3>

      <div class="row">
        <span>Username</span>
        <strong id="username">Loading...</strong>
      </div>

      <div class="row">
        <span>Email</span>
        <strong id="email">Loading...</strong>
      </div>

      <div class="row">
        <span>Status</span>
        <strong id="status">Active</strong>
      </div>

    </div>


    <!-- Transactions -->
    <div class="card">

      <h3>Recent Transactions</h3>

      <div class="row">
        <span>No transactions</span>
        <span>—</span>
      </div>

    </div>


    <button
      class="logout"
      onclick="logout()">
      Logout
    </button>

  </div>


  <script>

    const API_URL = "https://zonguru-jack-api.onrender.com";

    async function loadUser() {

      const token = localStorage.getItem("zonguru_token");

      if (!token) {
        window.location.href = "login.html";
        return;
      }

      try {

        const response = await fetch(API_URL + "/api/me", {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + token
          }
        });

        const data = await response.json();

        if (!response.ok || !data.success) {

          localStorage.removeItem("zonguru_token");
          localStorage.removeItem("zonguru_user");

          alert("Your session has expired. Please login again.");

          window.location.href = "login.html";
          return;
        }

        const user = data.user;

        document.getElementById("username").textContent =
          user.name || "User";

        document.getElementById("email").textContent =
          user.email || "-";

        document.getElementById("balanceAmount").textContent =
          Number(user.balance || 0).toFixed(2);

        document.getElementById("currency").textContent =
          user.currency || "USDT";

        document.getElementById("welcomeText").textContent =
          "Welcome, " + (user.name || "User");

      } catch (error) {

        console.error(error);

        alert("Cannot connect to Zonguru server.");

      }
    }


    function deposit() {
      alert("Deposit request page will be connected next.");
    }


    function withdraw() {
      alert("Withdrawal request page will be connected next.");
    }


    function logout() {

      localStorage.removeItem("zonguru_token");
      localStorage.removeItem("zonguru_user");

      window.location.href = "login.html";
    }


    loadUser();

  </script>

</body>
</html>
