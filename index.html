<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zonguru</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 900;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border-radius: 13px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .register {
      background: #2563eb;
      color: white;
    }

    .login {
      background: white;
      color: #2563eb;
      border: 2px solid #2563eb;
    }

    .status {
      margin-top: 28px;
      padding: 12px;
      background: #ecfdf5;
      color: #047857;
      border-radius: 12px;
      font-size: 13px;
    }

    .footer {
      margin-top: 25px;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <div class="logo">
        Zonguru
      </div>

      <div class="subtitle">
        Welcome to Zonguru
      </div>

      <a
        href="./register.html"
        class="button register">
        Create Account
      </a>

      <a
        href="./login.html"
        class="button login">
        Login
      </a>

      <div class="status">
        ● Zonguru service is online
      </div>

      <div class="footer">
        Zonguru Platform
      </div>

    </div>

  </div>

</body>
</html>
